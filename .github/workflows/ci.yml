name: CI

# The registry is data, and the catalog is derived from it: the only way a
# change here breaks is a source file that fails validation or a committed
# `docs/models.json` that no longer matches its sources. Both are caught here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Catalog is built from its sources
        run: pnpm build:check
