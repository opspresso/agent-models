name: CI

# Verify the catalog, routing core and isolated PostgreSQL behavior.
# It runs once per change, when the change reaches main and publishes the catalog. Pull requests do
# not start it; run it by hand (workflow_dispatch) when a branch needs a hosted check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: agent_models
          POSTGRES_PASSWORD: agent_models_test
          POSTGRES_DB: agent_models_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agent_models -d agent_models_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: PostgreSQL and provider HTTP integration
        env:
          DATABASE_URL: postgresql://agent_models:agent_models_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agent_models_test
        run: pnpm test:integration

      - name: Catalog is built from its sources
        run: pnpm build:check

      - name: Removals in this push are explicitly requested
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          REMOVAL_BASE: ${{ github.event.before }}
        run: node scripts/check-removals.ts "$REMOVAL_BASE" --pull-request
