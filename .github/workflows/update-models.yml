name: Update models

# Brings `models/` up to date with what the providers publish, republishes
# `docs/models.json`, and tells people what moved — every day at 22:00 UTC, or
# on demand.
#
# OpenRouter's catalog is public and always read. The vendor catalogs are read
# when their key is present and skipped (and said so in the job summary)
# when it is absent or rejected; a credential problem narrows the update.
# What each source may change and add is documented in README.md and `src/sources/`.
#
# Optional repository secrets: XAI_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GOOGLE_API_KEY, SLACK_WEBHOOK_URL.
#
# The workflow's token merges routine changes through a pull request. A model
# removals accumulate separately in one draft pull request for human review.
# The resulting `main` update republishes the classic Pages site at
# models.agrt.dev. The same token keeps the rolling "needs a look" issue.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      approve_anomaly:
        description: "Safety gate digest to apply (the `--approve-anomaly=` value printed by a quarantined run)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      update_outcome: ${{ steps.update.outcome }}
      report_exists: ${{ steps.candidate.outputs.report_exists }}
    timeout-minutes: 20
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync the current main branch
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes `models/`, `update-report.json` and the job summary. Exits 1 when
      # a non-credential source error occurs; the step continues so what the
      # other sources found is still built and proposed, and the failure is
      # raised again at the end.
      #
      # A quarantined run prints the digest of the exact anomaly set it refused.
      # Reviewing that report and dispatching the workflow again with the digest
      # in `approve_anomaly` is the only way to let that one set through — the
      # gate is otherwise unclearable from here, so a legitimate bulk change
      # would keep the job red forever.
      - name: Update sources from the providers
        id: update
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          APPROVE_ANOMALY: ${{ inputs.approve_anomaly }}
        run: |
          if [ -n "$APPROVE_ANOMALY" ]; then
            pnpm update-models "--approve-anomaly=$APPROVE_ANOMALY"
          else
            pnpm update-models
          fi

      - name: Build the catalog
        run: pnpm build

      - name: Save the generated candidate for ARM verification
        if: always()
        id: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-candidate"
          git add -- models docs
          git diff --cached --binary > "$RUNNER_TEMP/catalog-candidate/candidate.patch"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f update-report.json ]; then
            cp update-report.json "$RUNNER_TEMP/catalog-candidate/"
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-candidate
          path: ${{ runner.temp }}/catalog-candidate
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: build
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: catalog-candidate
          path: ${{ runner.temp }}/catalog-candidate
      - name: Restore the exact generated candidate
        run: |
          if [ -s "$RUNNER_TEMP/catalog-candidate/candidate.patch" ]; then
            git apply --index "$RUNNER_TEMP/catalog-candidate/candidate.patch"
          fi
      - name: Verify the generated catalog
        run: |
          pnpm typecheck
          pnpm test
          pnpm build:check
          node scripts/check-removals.ts HEAD

  publish:
    needs: [build, verify]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: catalog-candidate
          path: ${{ runner.temp }}/catalog-candidate
      - name: Restore the exact generated candidate
        run: |
          if [ -s "$RUNNER_TEMP/catalog-candidate/candidate.patch" ]; then
            git apply --index "$RUNNER_TEMP/catalog-candidate/candidate.patch"
          fi
      - run: cp "$RUNNER_TEMP/catalog-candidate/update-report.json" update-report.json
      - name: Merge routine updates through a pull request
        if: needs.verify.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `git diff --quiet` misses untracked files (a new maker's family
          # file) that `git add` below would include — porcelain sees both.
          if [ -z "$(git status --porcelain -- models docs)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "nalbam-bot"
          git config user.email "bot@nalbam.com"
          branch="automation/update-models-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add models docs
          git commit -m "chore: update models $(date -u +%F)"
          gh auth setup-git
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update models $(date -u +%F)" \
            --body "Automated provider and leaderboard refresh from $RUN_URL")
          gh pr merge "$pr_url" --squash --delete-branch

      - name: Create or update the draft pull request for model removals
        if: needs.verify.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(node -e 'const r=require("./update-report.json"); process.stdout.write(String(r.removalCandidates?.length ?? 0))')" = "0" ]; then
            echo "no model removals to propose"
            exit 0
          fi
          open_pr=$(gh pr list --state open --json headRefName,url --jq '[.[] | select(.headRefName | startswith("automation/model-removals-"))][0].url // ""')
          open_branch=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/model-removals-"))][0].headRefName // ""')
          git config user.name "nalbam-bot"
          git config user.email "bot@nalbam.com"
          git fetch origin main
          git switch main
          git merge --ff-only origin/main
          if [ -n "$open_branch" ]; then
            git fetch origin "$open_branch"
            git switch --track "origin/$open_branch"
            if ! git merge --no-edit --no-commit --no-ff origin/main; then
              # The catalog is regenerated below from the merged registry.
              # Source conflicts require review and must never be discarded.
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ "$conflicts" != "docs/models.json" ]; then
                echo "::error::cannot merge main into the removal proposal"
                git status --short
                exit 1
              fi
              git restore --source=origin/main --staged --worktree -- docs/models.json
            fi
            branch="$open_branch"
          else
            branch="automation/model-removals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
          fi
          pnpm propose-removals
          pnpm build
          node scripts/check-removals.ts HEAD --pull-request
          git add models docs
          if ! git diff --cached --quiet || git rev-parse --verify --quiet MERGE_HEAD > /dev/null; then
            git commit -m "chore: propose model removals $(date -u +%F)"
          fi
          gh auth setup-git
          git push origin "$branch"
          if [ -n "$open_pr" ]; then
            removal_pr="$open_pr"
            gh pr edit "$removal_pr" \
              --body "Review the lifecycle-qualified model removals accumulated through $RUN_URL. The workflow does not auto-merge this pull request."
          else
            removal_pr=$(gh pr create \
              --base main \
              --head "$branch" \
              --draft \
              --reviewer nalbam \
              --title "chore: review model removals $(date -u +%F)" \
              --body "Review the lifecycle-qualified model removals proposed by $RUN_URL. The workflow does not auto-merge this pull request.")
          fi
          echo "Model removal review: $removal_pr" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the update did not complete safely
        if: always() && (needs.build.outputs.update_outcome == 'failure' || needs.verify.result != 'success')
        run: |
          echo "::error::the model update did not complete safely — see the job summary"
          exit 1

  notify:
    needs: [build, verify, publish]
    if: always() && needs.build.outputs.report_exists == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.base_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: catalog-candidate
          path: ${{ runner.temp }}/catalog-candidate
      # Preserve failure notifications without publishing an unverified candidate.
      - name: Notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$RUNNER_TEMP/catalog-candidate/update-report.json" update-report.json
          pnpm notify
